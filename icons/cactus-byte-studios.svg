<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Cactus Byte Studios</title>
  <desc id="desc">Neon cactus and circuit mark with Cactus Byte Studios wordmark.</desc>
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cff35"/>
      <stop offset="1" stop-color="#39ff14"/>
    </linearGradient>
  </defs>
  <g transform="translate(28 28)">
    <rect x="0" y="0" width="264" height="264" rx="70" fill="#07100c" stroke="url(#ring)" stroke-width="5"/>
    <rect x="17" y="17" width="230" height="230" rx="58" fill="none" stroke="#39ff14" stroke-opacity=".2" stroke-width="2"/>
    <g filter="url(#glow)" fill="none" stroke="#39ff14" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M132 205V83"/>
      <path d="M132 132h-42c-22 0-32-15-32-35V78"/>
      <path d="M132 153h42c22 0 32-15 32-35V99"/>
      <path d="M105 205h54"/>
    </g>
    <g fill="#9cff35" filter="url(#glow)">
      <circle cx="58" cy="70" r="7"/><circle cx="206" cy="91" r="7"/>
      <circle cx="84" cy="132" r="6"/><circle cx="180" cy="153" r="6"/>
      <circle cx="132" cy="78" r="6"/><circle cx="132" cy="211" r="6"/>
    </g>
    <g stroke="#39ff14" stroke-width="4" stroke-linecap="round" opacity=".7">
      <path d="M25 64h28M25 96h20M25 128h28M25 160h20M25 192h28"/>
      <path d="M239 64h-28M239 96h-20M239 128h-28M239 160h-20M239 192h-28"/>
    </g>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="330" y="135" fill="#f5fff7" font-size="84" font-weight="900" letter-spacing="1">CACTUS</text>
    <text x="694" y="135" fill="#39ff14" font-size="84" font-weight="900" letter-spacing="1">BYTE</text>
    <text x="337" y="208" fill="#d7e4da" font-size="48" font-weight="700" letter-spacing="18">STUDIOS™</text>
    <path d="M335 238H1135" stroke="#39ff14" stroke-width="3" opacity=".45"/>
    <text x="337" y="278" fill="#7f9385" font-size="20" font-weight="700" letter-spacing="7">BUILD • SHIP • IMPROVE</text>
  </g>
</svg>
