name: Apply Fantasy v1.6.10 Startup Fix

on:
  push:
    branches:
      - hotfix/fantasy-startup-v1.6.10
    paths:
      - .github/workflows/v1610-apply-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/fantasy-startup-v1.6.10
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded startup patch
        run: python .github/scripts/v1610_fix.py
      - name: Full regression suite
        run: node --test
      - name: Verify deployment stays locked
        run: node -e "const v=require('./vercel.json');if(v.git?.deploymentEnabled!==false)process.exit(1)"
      - name: Commit bounded startup fix
        run: |
          git config user.name "Brett  Ross"
          git config user.email "rossbrett05@gmail.com"
          git add VERSION version.js api/app.js index.html live-refresh.js sleeper-live-sync.js tests
          git commit -m "fix: single Android splash and deterministic Sleeper startup v1.6.10"
          git push origin HEAD:hotfix/fantasy-startup-v1.6.10
