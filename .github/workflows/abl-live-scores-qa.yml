name: Fantasy Live Scores ABL QA

on:
  push:
    branches:
      - abl/fantasy-live-scores-v1.6.8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax checks
        run: |
          node --check api/live-scoreboard.js
          node --check api/nfl-data.js
          node --check api/nfl-schedule.js
          node --check api/nfl-source-policy.js
          node --check api/health.js
          node --check live-refresh.js
      - name: Regression tests
        run: node --test
      - name: Live provider smoke check
        run: |
          node <<'NODE'
          const { buildNflSourcePolicy } = require('./api/nfl-source-policy');
          const { normalizeEspnScoreboard } = require('./api/live-scoreboard');
          const policy = buildNflSourcePolicy(new Date());
          (async () => {
            const attempts = [];
            for (const candidate of policy.scoreboardCandidates) {
              try {
                const response = await fetch(candidate.url, { headers: policy.jsonHeaders });
                const payload = response.ok ? await response.json() : null;
                const events = payload ? normalizeEspnScoreboard(payload) : [];
                attempts.push({ provider: candidate.name, http: response.status, events: events.length });
                if (response.ok && events.length > 0) {
                  console.log(JSON.stringify({ selected: candidate.name, events: events.length, attempts }));
                  return;
                }
              } catch (error) {
                attempts.push({ provider: candidate.name, error: String(error?.message || error) });
              }
            }
            throw new Error('No live-score provider returned NFL events: ' + JSON.stringify(attempts));
          })();
          NODE
