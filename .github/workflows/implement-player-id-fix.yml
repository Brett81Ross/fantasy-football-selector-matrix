name: Implement Player ID Fix

on:
  push:
    branches:
      - hotfix-v1.6.8-sleeper-player-id

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message == 'chore: add player identity implementation workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-v1.6.8-sleeper-player-id
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source-level identity fix and unresolved-drop guard
        run: |
          python - <<'PY'
          from pathlib import Path

          provider = Path('draft-core/sleeper-provider.js')
          source = provider.read_text()
          old = """      const entry = directory && typeof directory === 'object' ? directory[id] : null;\n      if (!entry || typeof entry !== 'object') return id;\n      return resolveSleeperPlayerId({"""
          new = """      const entry = directory && typeof directory === 'object' ? directory[id] : null;\n      if (!entry || typeof entry !== 'object') return id;\n      const gsisId = text(entry.gsis_id ?? entry.gsisId);\n      if (gsisId && playerMap().has(gsisId)) return gsisId;\n      return resolveSleeperPlayerId({"""
          if old not in source:
              raise SystemExit('Sleeper roster resolution patch target not found')
          provider.write_text(source.replace(old, new, 1))

          waiver = Path('season-core/waiver-assassin.js')
          source = waiver.read_text()
          old = """  function playerRecord(id, values, snapshot) {\n    const raw=values.get(id)||{};"""
          new = """  function playerRecord(id, values, snapshot) {\n    const known=values.has(id);\n    const raw=values.get(id)||{};"""
          if old not in source:
              raise SystemExit('Waiver player record patch target not found')
          source = source.replace(old, new, 1)
          old = """      id,\n      name:text(raw.name)||id,"""
          new = """      id,\n      known,\n      name:text(raw.name)||id,"""
          if old not in source:
              raise SystemExit('Waiver known flag patch target not found')
          source = source.replace(old, new, 1)
          old = """    for (const drop of rosterPlayers) {\n      if (drop.id===add.id) continue;"""
          new = """    for (const drop of rosterPlayers) {\n      if (drop.id===add.id || !drop.known || !drop.position) continue;"""
          if old not in source:
              raise SystemExit('Waiver drop guard patch target not found')
          waiver.write_text(source.replace(old, new, 1))
          PY
      - name: Run player identity regression tests
        run: node --test tests/player-id-resolution.test.js tests/sleeper-id-crosswalk.test.js tests/waiver-assassin.test.js
      - name: Run full regression suite
        run: node --test tests/*.test.js
      - name: Commit tested fix
        run: |
          git config user.name "Brett Ross"
          git config user.email "rossbrett05@gmail.com"
          git add draft-core/sleeper-provider.js season-core/waiver-assassin.js
          git commit -m "fix: resolve Sleeper IDs before waiver recommendations"
          git push origin HEAD:hotfix-v1.6.8-sleeper-player-id
