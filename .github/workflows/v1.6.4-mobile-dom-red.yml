name: Fantasy v1.6.4 Mobile DOM QA
on:
  push:
    branches:
      - hotfix-v1.6.4-mobile-dom-latency
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax
        run: node --check ui-performance.js
      - name: Mobile DOM regression
        run: node --test tests/mobile-dom-latency.test.js
      - name: Full suite
        run: node --test tests/*.test.js
      - name: Guardrails
        run: |
          grep -q '"deploymentEnabled":false' vercel.json
          ! grep -R "serviceWorker.register" --include='*.js' --exclude-dir=.git --exclude-dir=.github --exclude-dir=tests .
