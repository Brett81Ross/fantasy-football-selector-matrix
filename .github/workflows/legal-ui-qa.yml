name: Legal UI QA
on:
  push:
    branches:
      - abl/fantasy-legal-ui-links-2026-09-07
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check legal-links.js
          node --check api/app.js
      - name: Legal UI tests
        run: node --test tests/legal-ui-links.test.js
      - name: Full regression
        run: node --test tests/*.test.js
