name: Fantasy v1.6.13 Splash Red Green
on:
  push:
    branches:
      - hotfix-v1.6.13-correct-android-splash
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Splash regression
        run: node --test tests/splash-handoff.test.js
