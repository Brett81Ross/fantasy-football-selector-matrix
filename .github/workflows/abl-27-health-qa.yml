name: ABL-27 Health QA
on:
  push:
    branches:
      - abl-sleeper-id-crosswalk
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/*.test.js
      - name: Smoke real health sources
        run: |
          node - <<'NODE'
          const handler = require('./api/health');
          const res = {
            code: 0,
            body: null,
            headers: {},
            setHeader(k,v){ this.headers[k]=v; },
            status(code){ this.code=code; return this; },
            json(body){ this.body=body; return this; }
          };
          handler({},res).then(() => {
            console.log(JSON.stringify({
              http: res.code,
              status: res.body?.status,
              seasons: res.body?.seasons,
              roster: res.body?.data?.roster,
              performance: res.body?.data?.performance,
              liveScoreboard: res.body?.data?.liveScoreboard
            }, null, 2));
            if (res.code === 503 || res.body?.status === 'OFFLINE') process.exit(1);
          }).catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
