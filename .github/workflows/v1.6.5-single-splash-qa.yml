name: Fantasy v1.6.5 Single Splash QA
on:
  push:
    branches:
      - hotfix-v1.6.5-single-splash
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and version
        run: |
          node --check api/app.js
          test "$(cat VERSION)" = "1.6.5"
      - name: Single splash regression
        run: node --test tests/single-splash.test.js
      - name: Full suite
        run: node --test tests/*.test.js
      - name: Guardrails
        run: |
          grep -q '"deploymentEnabled":false' vercel.json
          ! grep -R "serviceWorker.register" --include='*.js' --exclude-dir=.git --exclude-dir=.github --exclude-dir=tests .
