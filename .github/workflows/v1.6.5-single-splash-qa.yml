name: Fantasy v1.6.5 Single Splash QA
on:
  push:
    branches:
      - hotfix-v1.6.5-single-splash
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Single splash regression
        run: node --test tests/single-splash.test.js
