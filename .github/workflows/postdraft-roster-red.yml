name: Post Draft Roster QA
on:
  push:
    branches:
      - abl/fantasy-postdraft-roster-authority-2026-09-07
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: node --check draft-core/sleeper-provider.js
      - name: Full suite
        run: node --test tests/*.test.js
