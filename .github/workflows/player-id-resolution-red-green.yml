name: Player ID Resolution RED-GREEN

on:
  push:
    branches:
      - hotfix-v1.6.8-sleeper-player-id
  workflow_dispatch:

jobs:
  player-id-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run player identity regression tests
        run: node --test tests/player-id-resolution.test.js tests/sleeper-id-crosswalk.test.js tests/waiver-assassin.test.js
      - name: Run full regression suite
        run: node --test tests/*.test.js
