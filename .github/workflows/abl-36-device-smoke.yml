name: ABL-36 Device Smoke
on:
  push:
    branches:
      - abl-sleeper-id-crosswalk
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated Report Card browser fixture
        shell: bash
        run: |
          cat > _report-card-smoke.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <style>
          :root{--line:#264235;--muted:#9fb6aa}*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden;background:#050b08;color:#eef7f1;font-family:Arial,sans-serif}.wrap{width:100%;max-width:980px;margin:auto;padding:12px}.season-tabs{display:flex;gap:6px;overflow-x:auto}.season-tab{flex:0 0 auto;max-width:100%;padding:9px;border:1px solid var(--line);background:#08120d;color:inherit;border-radius:10px}.season-card{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px;min-width:0;overflow-wrap:anywhere}.season-kicker{font-size:10px;color:var(--muted)}.season-title{font-size:18px;font-weight:800;margin-top:4px}.season-meta{font-size:13px;margin-top:5px}.season-pill{display:inline-block;font-size:10px;margin:7px 5px 0 0;border:1px solid var(--line);padding:4px 6px;border-radius:999px}
          </style></head><body><div class="wrap"><div id="seasonFreshness"></div><div id="seasonTabs" class="season-tabs"><button class="season-tab active" data-season-tab="Weekly Attack Plan">Weekly Attack Plan</button><button class="season-tab" data-season-tab="What-If Matrix">What-If Matrix</button></div><div id="seasonPanel"></div></div>
          <script>
          window.state={players:[]};
          window.ffmLeagueSnapshot={week:1,myRosterId:'1'};
          window.FFMWeeklyAttackPlan={buildWeeklyAttackPlan(){return {actions:[],freshness:{status:'fresh'},confidence:88,risk:.2}}};
          const c=(label,headline)=>({label,headline,summary:'Long but realistic recommendation text that must wrap safely on a narrow Android screen without creating horizontal overflow.',confidence:88,risk:.2,freshness:'FRESH'});
          window.FFMWeeklyReportCard={buildWeeklyReportCard(){return {week:1,confidence:88,risk:.2,freshness:'FRESH',grades:{QB:88,RB:77,WR:91,TE:73,FLEX:82,BENCH:79,OVERALL:83},cards:{bestMove:c('Best Move','Start the highest-edge legal option'),biggestRisk:c('Biggest Risk','Questionable starter with early-lock backup'),biggestOpportunity:c('Biggest Opportunity','Waiver upgrade available at a weak position'),playerToSell:c('Player to Sell','Sell-high candidate with market premium'),playerToBuy:c('Player to Buy','Buy-low candidate with stronger rest-of-season value'),waiverPriority:c('Waiver Priority','Add the top available upgrade'),nextAction:c('Next Action','Resolve injury contingency before lineup lock')}}}};
          </script>
          <script src="/season-report-card-ui.js"></script>
          <script>
          setTimeout(()=>{document.documentElement.dataset.overflow=(document.documentElement.scrollWidth>document.documentElement.clientWidth)?'yes':'no';document.documentElement.dataset.report=(document.body.textContent.includes('WEEKLY TEAM REPORT CARD')&&document.body.textContent.includes('PLAYER TO BUY')&&document.body.textContent.includes('NEXT ACTION'))?'ready':'missing';},250);
          </script></body></html>
          HTML
      - name: Start local static server
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/ffm-smoke-server.log 2>&1 &
          echo $! >/tmp/ffm-smoke-server.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/_report-card-smoke.html >/dev/null && exit 0; sleep .25; done
          cat /tmp/ffm-smoke-server.log
          exit 1
      - name: Resolve Chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          echo "CHROME=$CHROME" >> "$GITHUB_ENV"
      - name: Narrow Android smoke 412x915
        shell: bash
        run: |
          "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=412,915 --virtual-time-budget=1200 --dump-dom http://127.0.0.1:4173/_report-card-smoke.html > /tmp/phone.html
          grep -q 'data-overflow="no"' /tmp/phone.html
          grep -q 'data-report="ready"' /tmp/phone.html
          grep -q 'Weekly Team Report Card' /tmp/phone.html
      - name: Galaxy Z Fold unfolded CSS viewport smoke 690x829
        shell: bash
        run: |
          "$CHROME" --headless=new --no-sandbox --disable-gpu --window-size=690,829 --virtual-time-budget=1200 --dump-dom http://127.0.0.1:4173/_report-card-smoke.html > /tmp/fold.html
          grep -q 'data-overflow="no"' /tmp/fold.html
          grep -q 'data-report="ready"' /tmp/fold.html
          grep -q 'Weekly Team Report Card' /tmp/fold.html
      # Temporary branch-only workflow; remove after device smoke verification.
