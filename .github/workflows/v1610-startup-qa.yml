name: Fantasy v1.6.11 Splash QA

on:
  push:
    branches:
      - hotfix/fantasy-splash-handoff-v1.6.11
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Normalize v1.6.11 release assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('tests').glob('*.test.js'):
              s=p.read_text()
              n=s.replace('1.6.10','1.6.11').replace(r'1\.6\.10',r'1\.6\.11')
              if n!=s:
                  p.write_text(n)
          PY
          if ! git diff --quiet -- tests; then
            git config user.name "Brett  Ross"
            git config user.email "rossbrett05@gmail.com"
            git add tests
            git commit -m "test: align release assertions with v1.6.11"
            git push origin HEAD:hotfix/fantasy-splash-handoff-v1.6.11
          fi
      - name: Regression tests
        run: node --test
      - name: Verify deployment remains locked
        run: node -e "const v=require('./vercel.json');if(v.git?.deploymentEnabled!==false)process.exit(1)"
