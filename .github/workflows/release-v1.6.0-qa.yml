name: Fantasy v1.6.0 Release QA
on:
  push:
    branches:
      - abl-sleeper-id-crosswalk
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax checks
        run: |
          node --check api/app.js
          node --check version-lock.js
          node --check season-report-card-ui.js
          node --check season-core/weekly-report-card.js
      - name: Version consistency
        run: |
          grep -q "const VERSION='1.6.0'" api/app.js
          grep -q "const VERSION='1.6.0'" version-lock.js
          test "$(cat VERSION)" = "1.6.0"
      - name: Release guardrails
        run: |
          grep -q '"deploymentEnabled":false' vercel.json
          ! grep -R "serviceWorker.register" --include='*.js' --exclude-dir=.git --exclude-dir=.github --exclude-dir=tests .
      - name: Full test suite
        run: node --test tests/*.test.js
      # Temporary branch-only release workflow; remove after verification.
