name: Fantasy v1.6.5 Final QA
on:
  push:
    branches:
      - hotfix-v1.6.5-startup-and-tap-architecture
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax and version
        run: |
          node --check api/app.js
          node --check live-refresh.js
          node --check live-draft-mode.js
          node --check fast-draft.js
          test "$(cat VERSION)" = "1.6.5"
          node -e "if(require('./version')!=='1.6.5')process.exit(1)"
      - name: Startup and tap regressions
        run: node --test tests/startup-tap-architecture.test.js tests/mobile-dom-latency.test.js
      - name: Full suite
        run: node --test tests/*.test.js
      - name: Guardrails
        run: |
          grep -q '"deploymentEnabled":false' vercel.json
          ! grep -R "serviceWorker.register" --include='*.js' --exclude-dir=.git --exclude-dir=.github --exclude-dir=tests .
