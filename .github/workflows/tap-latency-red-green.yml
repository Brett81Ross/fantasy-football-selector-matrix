name: Tap Latency RED-GREEN

on:
  push:
    branches:
      - hotfix-v1.6.7-android-tap-latency
  workflow_dispatch:

jobs:
  tap-latency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tap latency regression tests
        run: node --test tests/mobile-tap-latency.test.js tests/mobile-dom-latency.test.js tests/mobile-tap-polish.test.js
