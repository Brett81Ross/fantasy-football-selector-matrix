name: Season Intelligence Baseline QA
on:
  push:
    branches:
      - abl/fantasy-season-intelligence-2026-09-07
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check season-core/contracts.js
          node --check season-core/player-status.js
          node --check season-core/roster-doctor.js
          node --check season-core/lineup-optimizer.js
          node --check season-core/waiver-assassin.js
          node --check season-core/trade-hunter.js
          node --check draft-core/sleeper-provider.js
      - name: Season Intelligence targeted tests
        run: node --test tests/season-contracts.test.js tests/sleeper-season-snapshot.test.js tests/player-status.test.js tests/roster-doctor.test.js tests/lineup-optimizer.test.js tests/waiver-assassin.test.js tests/trade-hunter.test.js
      - name: Full regression
        run: node --test tests/*.test.js
