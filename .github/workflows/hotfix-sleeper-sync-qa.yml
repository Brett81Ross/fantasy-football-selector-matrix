name: Sleeper Sync Hotfix QA
on:
  push:
    branches:
      - hotfix/sleeper-league-sync-2026-09-09
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check Sleeper sync runtime
        run: node --check sleeper-live-sync.js
      - name: Full regression
        run: node --test tests/*.test.js
