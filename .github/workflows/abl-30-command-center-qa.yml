name: ABL-30 Command Center QA
on:
  push:
    branches:
      - abl-sleeper-id-crosswalk
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --test tests/*.test.js
      - name: Verify live ESPN schedule schema
        run: |
          node <<'NODE'
          const url='https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?limit=100';
          const r=await fetch(url,{headers:{Accept:'application/json','User-Agent':'Fantasy-Football-Matrix/1.5.5'}});
          if(!r.ok)throw new Error(`ESPN scoreboard ${r.status}`);
          const board=await r.json();
          const events=Array.isArray(board.events)?board.events:[];
          if(!events.length)throw new Error('ESPN scoreboard returned no events');
          const usable=events.filter(event=>{
            const competitors=event?.competitions?.[0]?.competitors;
            return Number.isFinite(Date.parse(event?.date))&&Array.isArray(competitors)&&competitors.length>=2&&competitors.every(c=>String(c?.team?.abbreviation||'').trim());
          });
          if(!usable.length)throw new Error('No event exposed kickoff date plus competitor abbreviations');
          console.log(`ESPN schedule schema OK: ${usable.length}/${events.length} events expose kickoff + team abbreviations`);
          NODE
