name: ABL-36 Final QA
on:
  push:
    branches:
      - abl-sleeper-id-crosswalk
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check api/app.js
      - run: node --check season-report-card-ui.js
      - run: node --check season-core/weekly-report-card.js
      - run: node --test tests/*.test.js
      # Temporary branch-only workflow; remove after final ABL-36 verification.
